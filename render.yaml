# Render Blueprint — Lyftr frontend (React + Vite), static site on Render's CDN (free).
# Render: New → Blueprint → select this repo. You are prompted for VITE_API_BASE_URL.
services:
  - type: web
    name: lyftr-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback; real files (/assets/*, /env.js, /favicon.svg) are still served as-is.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /env.js
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL # backend URL, e.g. https://lyftr-backend.onrender.com (no trailing slash)
        sync: false
      - key: VITE_ENABLE_SIMULATION_PANEL # shown only if the backend also enables simulation
        value: "true"
      - key: NODE_VERSION
        value: "22"

# Lyftr SPA on :3000 (nginx-unprivileged runs as uid 101; no root needed).
server {
    # IPv4 only: an IPv6 listen fails to start on hosts with IPv6 disabled in containers.
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime config generated at container start (see 40-lyftr-runtime-env.sh).
    location = /env.js {
        alias /tmp/lyftr-runtime/env.js;
        default_type application/javascript;
        include /etc/nginx/lyftr-security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Container health probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/lyftr-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html (never cached, so new builds apply).
    location / {
        include /etc/nginx/lyftr-security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
